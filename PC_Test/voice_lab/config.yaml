# voice_lab — 本地级联语音对话实验配置
#
# 路径相对 PC_Test/ 解析；模型、音频缓存和评测输出都不入库。
# 复制为 config.local.yaml 可覆盖任意字段（已被 .gitignore 忽略）。

asr:
  # sherpa = 流式 Zipformer（实时默认）；whisper = 离线高精度对照（CPU 较慢）
  backend: "sherpa"
  sherpa:
    # 2025-06-30 中文 streaming Zipformer int8；比仓库旧的 bilingual 模型准确很多。
    # 旧模型可改回 models/sherpa/asr（更快，但短指令重复字明显）。
    model_dir: "models/sherpa/asr_zh"
    num_threads: 4
    rule1_silence: 2.4
    rule2_silence: 1.2
    rule3_utt_len: 20.0
    # 该模型 token 表不含部分单字，热词表会告警；默认关闭，需要时自行打开。
    hotwords_file: ""
    hotwords_score: 2.0
    max_active_paths: 4
  # CTranslate2 Whisper：本地 int8，CPU 上比 openai-whisper 快约一半
  faster_whisper:
    model_dir: "models/whisper_ct2/small"
    model: "small"
    download_root: "models/whisper_ct2"
    device: "cpu"
    compute_type: "int8"
    cpu_threads: 8
    num_workers: 1
    language: "zh"
    beam_size: 1
    vad_filter: true
  whisper:
    model: "small"              # tiny/base/small/medium
    download_root: "models/whisper"
    device: "cpu"
    language: "zh"
    beam_size: 1
    fp16: false

llm:
  # hybrid = 明确设备指令走规则快路径，其余走本地 LLM（默认，交互最快）
  # llama_cpp = 纯本地 Qwen2.5；openai = 任意 OpenAI 兼容 API；rules = 纯规则基线
  backend: "hybrid"
  history_rounds: 3
  max_tool_calls: 4
  max_tokens: 128
  temperature: 0.2
  llama_cpp:
    # 3B 质量更好；想要更低延迟可换 qwen2.5-1.5b-instruct-q4_k_m.gguf
    model_path: "models/qwen/qwen2.5-3b-instruct-q4_k_m.gguf"
    n_ctx: 4096
    n_threads: 12
    n_batch: 512
    n_gpu_layers: 0
    verbose: false
  openai:
    base_url: "https://api.siliconflow.cn/v1"
    model: "Qwen/Qwen3.5-4B"
    api_key: ""                  # 建议留空，用环境变量 LLM_API_KEY 或 PC_Test/llm_key.txt
    api_key_file: "llm_key.txt"
    timeout_s: 30.0
    extra_body:
      enable_thinking: false

tts:
  # edge = edge-tts（默认，自然、首句约 0.7~1.3 s）；sherpa = 离线 VITS；cosyvoice = 云端 CosyVoice2
  backend: "edge"
  cache_dir: "voice_lab/output/tts_cache"
  edge:
    voice: "zh-CN-XiaoxiaoNeural"
    rate: "+0%"
    volume: "+0%"
  sherpa:
    model_dir: "models/sherpa/tts"
    speaker_id: 0
    speed: 1.0
    num_threads: 2
  cosyvoice:
    base_url: "https://api.siliconflow.cn/v1"
    model: "FunAudioLLM/CosyVoice2-0.5B"
    voice: "anna"
    api_key: ""
    api_key_file: "llm_key.txt"
    response_format: "mp3"
    timeout_s: 60.0

dialog:
  system_prompt: |
    你是智能家居语音助手。用户要求控制设备时必须调用工具，不要编造执行结果。
    回复口语化、简短，一次只说一两句；不要输出 JSON、工具名或思维过程。
    不确定意图时简短反问。
  command_timeout: 8.0
  followup_timeout: 8.0
  max_utterance_seconds: 15.0

# 连续语音模式：KWS 唤醒 + VAD 端点 + 半双工状态机。
# --wake 或 --serve --wake 启用；不启用时仍是按一下录一句。
wake:
  enabled: false
  kws:
    model_dir: "models/sherpa/kws"
    keywords_file: "models/sherpa/kws/keywords.txt"
    keywords_score: 1.5
    keywords_threshold: 0.25
    num_threads: 2
  ack: "chirp"              # chirp=滴声 / none
  chirp_freq: 880
  chirp_ms: 120
  command_timeout: 8.0      # 唤醒后等用户开口
  followup_timeout: 8.0     # TTS 结束后追问窗口
  max_utterance_seconds: 15.0
  barge_in: false           # 真打断需要 AEC；默认半双工，SPEAKING 时关麦

server:
  host: "127.0.0.1"
  port: 8110

audio:
  sample_rate: 16000
  channels: 1
  record_seconds: 6.0
  silence_seconds: 0.8
  energy_threshold: 0.012
  min_speech_seconds: 0.2
