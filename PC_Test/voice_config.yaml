# 语音交互模式配置 —— voice_assistant.py 读取（mcp/qwen 相关项已随重构调整）
# 命令行参数会覆盖本文件里的同名字段。
# 复制为 voice_config.local.yaml 做个人定制（已被 .gitignore 忽略）。

# ── web 硬件网关（本进程不碰串口/MCP，硬件动作全部经 HTTP 走这里）──
# 环境变量 SMART_HOME_WEB_URL 优先（Docker 里为 http://web:5000）。
gateway:
  url: "http://127.0.0.1:5000"

# ── LLM 引擎：默认外部 API（硅基流动 SiliconFlow，OpenAI 兼容，比本地推理快一个量级）──
# mode=siliconflow：硅基流动云端（默认）——Key 申请 https://cloud.siliconflow.cn/account/ak
# mode=dashscope  ：阿里云百炼云端（备选，OpenAI 兼容）
# mode=local      ：本地推理（离线 fallback，qwen_server.py 提供服务）
# Key 来源三选一，优先级从高到低：本文件 api_key > 环境变量 LLM_API_KEY /
# SILICONFLOW_API_KEY / DASHSCOPE_API_KEY > 密钥文件 PC_Test/llm_key.txt
llm:
  mode: "siliconflow"
  base_url: "https://api.siliconflow.cn/v1"
  api_key: "none"       # 留 none，把 sk-xxx 单独写进 llm_key.txt（已 gitignore）更安全
  model: "Qwen/Qwen3.5-4B"   # 硅基流动模型广场里的 id（带组织前缀）；换名去广场复制
  # api_key_file: "llm_key.txt"   # 相对 PC_Test 或绝对路径；默认已按 llm_key.txt →
  #                                siliconflow_key.txt → dashscope_key.txt 依次找
  # 附加请求体参数（每次 /chat/completions 都合并进去）。siliconflow 已在代码里默认关思考：
  #   {"enable_thinking": false}
  # Qwen3.5 属思考型模型，开着思考会先把 reasoning_content 流完才出正文，首字延迟 20~60s；
  # 硅基流动只认顶层 enable_thinking，vLLM 那套 chat_template_kwargs 它不认。
  # 想改回思考模式或给别的 mode 加参数就在这里覆盖，例如：
  # extra_body:
  #   enable_thinking: true
  #   max_tokens: 512
  # 切百炼：mode: "dashscope"，base_url: "https://dashscope.aliyuncs.com/compatible-mode/v1"，
  #         model: "qwen-plus"
  # 切本地：mode: "local"，base_url: "http://127.0.0.1:8000/v1"，
  #         model: "qwen2.5-3b-instruct-q4_k_m"
  system_prompt: |
    你是智能家居语音助手，控制一台经 web 硬件网关连接的 Arduino 智能家居模型。
    规则：
    1) 涉及硬件操作（灯/门/窗/风扇/蜂鸣器/OLED/数码管）必须调用对应工具，禁止编造执行结果。
    2) 查询当前状态（温度、湿度、是否有人等）必须先调 get_sensor_status，再用真实数据回答。
    3) 回复口语化、简短（一两句即可），不要列工具名或 JSON。
    4) 不确定用户意图时简短反问，不要乱调设备。
    设备能力：门、窗、风扇（可调速）、RGB 灯、蜂鸣器、OLED 屏、数码管、红外发射。
  local:                # mode=local 时生效（qwen_server.py 读取）
    gguf_path: "models/qwen/qwen2.5-3b-instruct-q4_k_m.gguf"  # 3B-Q4 ~2GB
    n_ctx: 8192         # 上下文长度
    n_threads: 0        # CPU 线程数，0=自动
    n_gpu_layers: 0     # 香橙派 AI Pro（昇腾 NPU，llama.cpp 不支持）→ 纯 CPU；0
    port: 8000

# ── 多轮对话上下文（保留最近 N 轮 user/assistant，追问有记忆；0=每句独立）──
history_rounds: 4

# ── Sherpa-ONNX 语音前端（KWS 唤醒 + 流式 ASR + 本地 TTS，全离线，香橙派 CPU 可实时）──
# 模型下载: py -3.13 download_sherpa_models.py
sherpa:
  provider: "cpu"       # sherpa 引擎推理后端（cpu；INT8 模型在香橙派多核 ARM 上足够实时）
  num_threads: 2        # KWS/ASR 推理线程（香橙派可试 4）
  kws:                  # 唤醒词检测（zipformer-wenetspeech 3.3M，声学级唤醒）
    model_dir: "models/sherpa/kws"
    keywords_file: "models/sherpa/kws/keywords.txt"
    keywords_score: 1.5       # 唤醒词打分提升（调大更易唤醒，误唤醒也会增加）
    keywords_threshold: 0.25  # 声学阈值（调小更灵敏，误唤醒也会增加）
  asr:                  # 流式识别（streaming Zipformer 中英双语，INT8 三件套）
    model_dir: "models/sherpa/asr"
    rule1_silence: 2.4  # 端点规则：句尾静音秒数
    rule2_silence: 1.2  #           句中有内容后的静音秒数
    rule3_utt_len: 20.0 #           最长句长（秒）
    hotwords_file: "models/sherpa/asr/hotwords.txt"  # 智能家居热词（开灯/红色/蜂鸣器…加权提准）
    hotwords_score: 2.0 # 热词加成（1.5~3：越大越偏向热词，过大可能误识；想加词直接编辑该文件）
  tts:                  # 本地语音合成（vits-melo-tts-zh_en）
    model_dir: "models/sherpa/tts"
    speaker_id: 0       # melo-tts-zh_en 说话人 id（0=中文女声）
    speed: 1.0          # 语速倍数
    num_threads: 2

# ── 唤醒词「Hey Bota」（仅用于：从「唤醒词+指令」连读句中剥前缀；实际唤醒由 KWS 声学检测）──
# 声学词表见 models/sherpa/kws/keywords.txt（英文词用拼音音近拼接，4 个声调变体），
# 修改唤醒词后重跑 py -3.13 download_sherpa_models.py 会覆盖该文件，自定义请直接编辑。
wake:
  words:
    - "hey bota"
  command_timeout: 6.0   # 命令模式等整句秒数
  followup_timeout: 8.0  # 回答后追问窗口（秒），期间无需重新唤醒即可直接说话
  wake_ack: "在的"        # voice/both 模式命中唤醒词后 TTS 回一句
  ack_mode: "chirp"      # 唤醒反馈：chirp=滴声(零延迟，推荐) / voice=说"在的" / both / none
  chirp_freq: 880        # 滴声音高 Hz
  chirp_ms: 120          # 滴声时长 ms

# ── 手动输入通道（键盘文字对话/空行语音触发；HTTP 供香橙派按钮/手机/外部程序接入）──
trigger:
  keyboard: true         # 终端里打字回车=文本指令；空回车=开启语音监听（不想误触可关）
  http: true             # 开启 HTTP 接口（控制台网页 + /trigger /say /state /events）
  host: "0.0.0.0"        # 监听地址（0.0.0.0=局域网可访问；127.0.0.1=仅本机）
  port: 8101
  # 用法：
  #   浏览器开 http://<香橙派IP>:8101/  聊天式控制台（点麦克风或直接打字，对话实况流）
  #   开语音监听: curl http://<香橙派IP>:8101/trigger
  #   直接下发文本指令: curl -X POST http://<香橙派IP>:8101/say -H "Content-Type: application/json" -d "{\"text\":\"把灯打开\"}"
  #                    curl "http://<香橙派IP>:8101/say?text=把灯打开"
  #   对话实况（SSE）: curl -N http://<香橙派IP>:8101/events
  #   GPIO 按钮守护进程：按下时 curl /trigger；其他系统要对话直接 POST /say

# ── 麦克风 ──
mic:
  device_index: null   # null=系统默认输入；用 `--list-mic` 查看索引
