<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自动化规则 - 智能家居</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20261002k">
    <!-- Blockly 全量自托管（内网/校园网无外网也可用）-->
    <script src="{{ url_for('static', filename='vendor/blockly/blockly.min.js') }}?v=20261001a"></script>
    <script>
        if (typeof Blockly !== 'undefined') {
            document.write('<script src="{{ url_for('static', filename='vendor/blockly/zh-hans.js') }}?v=20261001a"><\/script>');
        }
    </script>
    <style>
        /* ==================== 视图切换 ==================== */
        .auto-layout { display: grid; grid-template-columns: 1fr 320px; gap: 16px; align-items: start; }
        .auto-toolbar { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; }
        .auto-toolbar h3 { margin: 0; font-size: 16px; }
        .auto-toolbar .spacer { flex: 1 1 auto; }
        .rule-count { font-size: 12px; color: var(--text-secondary); }

        /* ==================== 规则卡片（iOS 快捷指令风）==================== */
        .rule-grid { display: grid; gap: 10px; }
        .rule-card { display: flex; align-items: center; gap: 12px; padding: 12px 14px;
                     border: 1px solid var(--border-color); border-radius: 12px;
                     background: var(--bg-secondary); cursor: pointer; transition: .15s; }
        .rule-card:hover { border-color: rgba(200,137,47,.45); background: rgba(200,137,47,.05); }
        .rule-card.disabled { opacity: .5; }
        .rc-icon { width: 42px; height: 42px; flex: 0 0 42px; border-radius: 10px;
                   display: flex; align-items: center; justify-content: center; font-size: 20px;
                   background: rgba(154,122,160,.16); }
        .rc-icon.evt { background: rgba(200,114,47,.16); }
        .rc-icon.time { background: rgba(200,137,47,.16); }
        .rc-main { flex: 1 1 auto; min-width: 0; }
        .rc-name { font-weight: 600; font-size: 14px; white-space: nowrap;
                   overflow: hidden; text-overflow: ellipsis; }
        .rc-sub { font-size: 12.5px; color: var(--text-secondary); margin-top: 2px;
                  white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .rc-meta { font-size: 11.5px; color: var(--text-muted); margin-top: 5px;
                   display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
        .rc-actions { display: flex; align-items: center; gap: 2px; flex: 0 0 auto; }
        .icon-btn { width: 32px; height: 32px; border-radius: 8px; border: 1px solid transparent;
                    background: transparent; color: var(--text-secondary); font-size: 15px;
                    cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .icon-btn:hover { background: rgba(184,165,138,.22); color: var(--accent-cyan); }
        .rc-name-input { font: inherit; font-weight: 600; font-size: 14px; width: 100%;
                         background: var(--bg-card); color: var(--text-primary);
                         border: 1px solid var(--accent-cyan); border-radius: 6px; padding: 2px 6px; }
        .empty-rules { color: var(--text-secondary); font-size: 13px; padding: 28px; text-align: center; }

        /* 卡片 ⋮ 菜单 */
        .card-menu { position: fixed; z-index: 60; min-width: 172px; padding: 6px;
                     background: #ffffff; border: 1px solid var(--border-color);
                     border-radius: 10px; box-shadow: 0 12px 32px rgba(160,130,95,.18); }
        .card-menu button { display: flex; width: 100%; align-items: center; gap: 8px;
                            padding: 8px 10px; border: 0; border-radius: 7px; background: transparent;
                            color: var(--text-primary); font-size: 13.5px; text-align: left; cursor: pointer; }
        .card-menu button:hover { background: rgba(200,137,47,.14); }
        .card-menu button:disabled { opacity: .4; cursor: default; }
        .card-menu button.danger { color: var(--accent-red); }
        .card-menu .sep { height: 1px; margin: 5px 6px; background: var(--border-color); }

        /* ==================== 单条规则编辑器 ==================== */
        .editor-bar { display: flex; align-items: center; gap: 10px; flex-wrap: wrap; }
        .editor-name { flex: 1 1 200px; min-width: 140px; font-size: 14px; font-weight: 600;
                       padding: 7px 10px; border-radius: 8px; border: 1px solid var(--border-color);
                       background: var(--bg-secondary); color: var(--text-primary); }
        .editor-toggle { display: flex; align-items: center; gap: 6px; font-size: 13px; }
        #blocklyArea { width: 100%; height: calc(100vh - 215px); min-height: 440px;
                       border-radius: var(--radius-sm); overflow: hidden;
                       border: 1px solid var(--border-color); background: #faf5ee; position: relative; }
        #blocklyDiv { position: absolute; inset: 0; }
        /* 工具箱：窄分类栏 */
        .blocklyToolboxDiv { width: 96px !important; }
        .blocklyToolboxContents { padding: 4px 0; }
        .blocklyTreeRow { border-radius: 8px; margin: 2px 6px; min-height: 34px; padding: 4px 6px; }
        .blocklyTreeRow:not(.blocklyTreeSelected):hover { background: rgba(184,165,138,.16); }
        .blocklyTreeLabel { font-size: 13px; }
        .blocklyMainBackground { stroke: none !important; }
        .fit-btn { position: absolute; top: 10px; right: 10px; z-index: 20; width: 34px; height: 34px;
                   border-radius: 8px; border: 1px solid var(--border-color);
                   background: rgba(255,253,249,.94); color: #6b5f50; font-size: 16px;
                   cursor: pointer; display: flex; align-items: center; justify-content: center; }
        .fit-btn:hover { background: rgba(200,137,47,.18); color: #c8892f; }

        /* ==================== 侧栏 ==================== */
        .badge { font-size: 11px; padding: 2px 8px; border-radius: 999px; }
        .badge.on { background: rgba(107,143,94,.15); color: var(--accent-green); }
        .badge.off { background: rgba(192,85,74,.12); color: var(--accent-red); }
        .badge.evt { background: rgba(200,114,47,.15); color: var(--accent-orange); }
        .badge.disabled { background: rgba(184,165,138,.2); color: var(--text-secondary); }
        .mode-badge { font-weight: 600; font-size: 14px; padding: 8px 12px; border-radius: var(--radius-sm);
                      background: rgba(200,137,47,.10); color: var(--accent-cyan); }
        .mode-badge.mode-manual { background: rgba(200,114,47,.12); color: var(--accent-orange); }
        .mode-badge.mode-away { background: rgba(192,85,74,.12); color: var(--accent-red); }
        .manual-grace { display: flex; flex-wrap: wrap; gap: 6px; }
        .grace-chip { font-size: 12px; padding: 4px 10px; border-radius: 999px;
                      background: rgba(200,114,47,.14); color: var(--accent-orange); }
        .grace-chip.empty { background: rgba(107,143,94,.10); color: var(--accent-green); }
        .mode-hint { font-size: 12px; color: var(--text-secondary); line-height: 1.7; }
        .auto-log { width: 100%; font-size: 12px; border-collapse: collapse; }
        .auto-log th, .auto-log td { padding: 6px 8px; border-bottom: 1px solid var(--border-color);
                                     text-align: left; vertical-align: top; }
        .auto-log th { color: var(--text-secondary); font-weight: 500; }
        .log-wrap { max-height: 320px; overflow-y: auto; }
        .mini-btn { font-size: 12px; padding: 4px 10px; }
        .missing-box { position: absolute; inset: 20px; z-index: 5; display: flex; align-items: center;
                       justify-content: center; background: var(--bg-card);
                       border: 1px dashed var(--accent-orange); color: var(--accent-orange);
                       border-radius: var(--radius-sm); text-align: center; padding: 20px; }
        @media (max-width: 1100px) { .auto-layout { grid-template-columns: 1fr; } }
    </style>
</head>
<body>
    <nav class="navbar">
        <div class="nav-brand">
            <svg class="nav-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                <polyline points="9 22 9 12 15 12 15 22"/>
            </svg>
            <span data-i18n="system.title">智能家居控制系统</span>
        </div>
        <div class="nav-links">
            <a href="/" class="nav-link" data-i18n="nav.dashboard">仪表盘</a>
            <a href="/history" class="nav-link" data-i18n="nav.history">历史数据</a>
            <a href="/access" class="nav-link" data-i18n="nav.access">门禁管理</a>
            <a href="/hardware" class="nav-link" data-i18n="nav.hardware">硬件管理</a>
            <a href="/voice" class="nav-link" data-i18n="nav.voice">语音助手</a>
            <a href="/automation" class="nav-link active" data-i18n="nav.automation">自动化</a>
        </div>
        <div class="nav-status">
            <span class="status-dot online"></span>
            <span data-i18n="system.online">系统在线</span>
            <span id="currentTime" class="time-display">--:--:--</span>
        </div>
        <button class="lang-switch" onclick="setLang(I18N.currentLang === 'zh' ? 'en' : 'zh')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <circle cx="12" cy="12" r="10"/>
                <line x1="2" y1="12" x2="22" y2="12"/>
                <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
            </svg>
            <span data-i18n="nav.lang">EN</span>
        </button>
    </nav>

    <div id="notification" class="notification hidden"></div>

    <!-- 卡片 ⋮ 菜单（全局唯一，按需定位） -->
    <div id="cardMenu" class="card-menu hidden"></div>

    <main class="main-content">
        <!-- ==================== 视图一：规则列表 ==================== -->
        <div id="listView">
            <div class="card" style="margin-bottom:12px">
                <div class="card-body auto-toolbar">
                    <h3>🧩 自动化</h3>
                    <span id="ruleCount" class="rule-count"></span>
                    <span class="spacer"></span>
                    <button class="btn btn-primary" onclick="createRule()">＋ 新建规则</button>
                    <button class="btn" onclick="restorePresets()">♻️ 恢复内置</button>
                    <button class="btn mini-btn" onclick="refreshPreview()">🔄</button>
                </div>
            </div>
            <div class="auto-layout">
                <div id="ruleGrid" class="rule-grid"></div>

                <div style="display:flex;flex-direction:column;gap:16px">
                    <div class="card">
                        <div class="card-header"><h3>🏠 全屋模式</h3></div>
                        <div class="card-body" style="display:flex;flex-direction:column;gap:10px">
                            <div id="homeModeBadge" class="mode-badge">当前模式：--</div>
                            <div style="display:flex;gap:8px;flex-wrap:wrap">
                                <button class="btn mini-btn" onclick="setHomeMode('auto')">🤖 自动</button>
                                <button class="btn mini-btn" onclick="setHomeMode('manual')">✋ 手动</button>
                                <button class="btn mini-btn" onclick="setHomeMode('away')">🚪 离家</button>
                            </div>
                            <div style="display:flex;gap:8px;flex-wrap:wrap">
                                <button class="btn mini-btn" id="fanOverrideBtn"
                                        onclick="cycleFanOverride()">🌀 风扇：--</button>
                                <button class="btn mini-btn" id="lightLevelBtn"
                                        onclick="cycleLightLevel()">💡 灯光：--</button>
                            </div>
                            <div>
                                <div style="font-size:12px;color:var(--text-secondary);margin-bottom:4px">手动优先</div>
                                <div id="manualGraceChips" class="manual-grace">
                                    <span class="grace-chip empty">无</span>
                                </div>
                            </div>
                            <span id="homeModeDetail" class="mode-hint"></span>
                            <span class="mode-hint">手动操作后该设备 30 秒内不被自动规则改动；离家关闭全屋设备。</span>
                            <span class="mode-hint">🛡️ 风扇只能由你在风扇卡片手动开启——任何自动化规则/全屋模式都只能关风扇，不能开风扇。</span>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>🖥️ OLED 轮播</h3></div>
                        <div class="card-body" style="display:flex;flex-direction:column;gap:10px">
                            <label style="display:flex;align-items:center;gap:8px;font-size:14px">
                                <input type="checkbox" id="oledEnabled"> 启用轮播
                            </label>
                            <label style="display:flex;align-items:center;gap:8px;font-size:14px">
                                每
                                <input type="number" id="oledInterval" value="5" min="1" max="3600" step="1"
                                       style="width:70px"> 秒切页
                            </label>
                            <span style="font-size:12px;color:var(--text-secondary)">仅英文/数字，每行 16 字符</span>
                            <button class="btn btn-primary" onclick="saveOledConfig()">💾 保存设置</button>
                            <span id="oledStatus" style="font-size:12px;color:var(--text-secondary)"></span>
                        </div>
                    </div>
                    <div class="card">
                        <div class="card-header"><h3>📜 执行记录</h3></div>
                        <div class="card-body log-wrap">
                            <table class="auto-log">
                                <thead><tr><th>时间</th><th>规则</th><th>结果</th></tr></thead>
                                <tbody id="autoLogBody"></tbody>
                            </table>
                        </div>
                    </div>
                </div>
            </div>
        </div>

        <!-- ==================== 视图二：单条规则编辑器 ==================== -->
        <div id="editorView" class="hidden">
            <div class="card">
                <div class="card-body editor-bar">
                    <button class="btn" onclick="closeEditor()">← 返回</button>
                    <input id="editorName" class="editor-name" type="text" placeholder="规则名称">
                    <label class="editor-toggle">
                        <input type="checkbox" id="editorEnabled"> 启用
                    </label>
                    <button class="btn" onclick="runEditing()">▶ 运行一次</button>
                    <button class="btn btn-primary" onclick="saveEditor()">💾 保存</button>
                </div>
            </div>
            <div class="card" style="margin-top:12px">
                <div class="card-body">
                    <div id="blocklyArea">
                        <div id="blocklyDiv"></div>
                        <button id="fitViewBtn" class="fit-btn" title="适应屏幕" type="button">⛶</button>
                        <div id="blocklyMissing" class="missing-box hidden">
                            积木引擎加载失败，请 Ctrl+F5 强制刷新。
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </main>

    <script src="{{ url_for('static', filename='js/lang.js') }}?v=20261002k"></script>
    <script src="{{ url_for('static', filename='js/automation.js') }}?v=20261002k"></script>
</body>
</html>
