<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>可疑行为记录</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=Noto+Serif+SC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
<style>
:root{
  --bg-primary:#f6f2ea;--bg-card:#ffffff;--border:#e9e1d5;
  --text-primary:#3b332a;--text-secondary:#7c7264;--text-muted:#a89e8d;
  --accent:#a9743f;--accent-strong:#96632f;--danger:#b5544a;
  --radius:18px;--radius-sm:10px;
  --transition:all .3s cubic-bezier(.4,0,.2,1);
}
*{margin:0;padding:0;box-sizing:border-box}
body{
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI','PingFang SC','Microsoft YaHei',sans-serif;
  color:var(--text-primary);background:var(--bg-primary);line-height:1.5;
  background-image:radial-gradient(1200px 600px at 50% -10%,#fffefb 0%,rgba(246,242,234,0) 70%),
                   radial-gradient(900px 520px at 92% 112%,rgba(169,116,63,.16) 0%,rgba(246,242,234,0) 62%);
  background-attachment:fixed;
  max-width:1000px;margin:0 auto;padding:40px 20px 56px;
}
header{display:flex;justify-content:space-between;align-items:center;gap:16px}
h1{font-size:24px;font-weight:600;letter-spacing:.5px}
header a{
  display:inline-flex;align-items:center;height:36px;padding:0 16px;font-size:14px;font-weight:600;
  color:var(--text-secondary);background:#fffdfa;border:1px solid var(--border);border-radius:999px;
  text-decoration:none;transition:var(--transition);
}
header a:hover{color:var(--text-primary);border-color:var(--accent);background:#f5efe6}
.lead{margin:12px 0 0;font-size:14px;color:var(--text-secondary)}
#refresh{
  margin-top:16px;padding:9px 18px;font-size:14px;font-weight:600;color:#fff;cursor:pointer;
  background:var(--accent);border:none;border-radius:var(--radius-sm);transition:var(--transition);
}
#refresh:hover{background:var(--accent-strong);box-shadow:0 6px 18px rgba(169,116,63,.32);transform:translateY(-1px)}
#refresh:active{transform:translateY(0)}
#events{margin-top:10px;color:var(--text-secondary)}
article{
  background:var(--bg-card);padding:20px;margin:16px 0;border:1px solid var(--border);
  border-radius:var(--radius);box-shadow:0 4px 16px rgba(120,95,60,.10);
}
article h2{font-size:17px;font-weight:600;color:var(--text-primary)}
article p{margin-top:4px;font-size:14px;color:var(--text-secondary)}
img{max-width:100%;max-height:360px;margin-top:12px;border-radius:var(--radius-sm);border:1px solid var(--border)}
small{color:var(--text-muted)}
html[lang="en"] body{font-family:'Plus Jakarta Sans',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif}
html[lang="en"] h1,html[lang="en"] article h2{font-family:'Fraunces',Georgia,serif;font-weight:600}
</style>
</head>
<body>
<header><h1>可疑行为记录</h1><a href="/">返回首页</a></header>
<p class="lead">记录连续三次及以上密码错误，以及启用门口传感器后的长时间停留。记录不代表已确认入侵。</p>
<button id="refresh">刷新记录</button><div id="events" role="status">正在加载…</div>
<script>
async function load(){
const box=document.getElementById('events');
try{const response=await fetch('/api/security/events');if(!response.ok)throw Error('读取失败，请检查登录状态');
const events=await response.json();box.replaceChildren();if(!events.length)box.textContent='暂无可疑行为记录';
for(const event of events){const card=document.createElement('article');const title=document.createElement('h2');
title.textContent=event.reason==='keypad_failures'?'连续密码错误 '+event.details.failures+' 次':'门口持续停留';
const date=document.createElement('p');date.textContent=new Date(event.timestamp).toLocaleString();card.append(title,date);
if(event.capture==='saved'){const photo=document.createElement('img');photo.src='/api/security/images/'+encodeURIComponent(event.id);photo.alt='事件发生时的摄像头照片';photo.loading='lazy';card.append(photo);}
else{const status=document.createElement('p');status.textContent=event.capture==='pending'?'等待拍照':'拍照失败：'+(event.error||'未知原因');card.append(status);}
box.append(card);}}
catch(error){box.textContent=error.message;}}
document.getElementById('refresh').addEventListener('click',load);load();
</script>
</body>
</html>
