<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
        // 在样式加载前同步语言：英文模式启用专用拉丁字体与排版（见 style.css 的 html[lang="en"] 层）
        (function () {
            try {
                var lang = localStorage.getItem('smart_home_lang') || 'zh';
                document.documentElement.lang = lang === 'zh' ? 'zh-CN' : 'en';
            } catch (e) { /* 隐私模式等忽略 */ }
        })();
    </script>
    <title data-i18n="{% block doc_title_key %}system.title{% endblock %}">{% block doc_title %}智能家居控制系统{% endblock %}</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400..700&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Serif+SC:wght@500;600;700&family=Plus+Jakarta+Sans:wght@400..800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}?v=20261008c">
    {% block head %}{% endblock %}
</head>
<body>
    {% set p = request.path %}
    <div class="app-shell">
        <!-- 左侧导航 -->
        <aside class="sidebar" id="sidebar">
            <div class="side-brand">
                <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/>
                    <polyline points="9 22 9 12 15 12 15 22"/>
                </svg>
                <span data-i18n="system.title">智能家居控制系统</span>
            </div>
            <nav class="side-nav">
                <a href="/" class="side-link {{ 'active' if p == '/' else '' }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 9l9-7 9 7v11a2 2 0 01-2 2H5a2 2 0 01-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg>
                    <span data-i18n="nav.dashboard">我的家</span>
                </a>
                <a href="/rooms" class="side-link {{ 'active' if p == '/rooms' else '' }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1.5"/><rect x="14" y="3" width="7" height="7" rx="1.5"/><rect x="3" y="14" width="7" height="7" rx="1.5"/><rect x="14" y="14" width="7" height="7" rx="1.5"/></svg>
                    <span data-i18n="nav.rooms">房间与设备</span>
                </a>
                <a href="/automation" class="side-link {{ 'active' if p == '/automation' else '' }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M13 2L4.09 12.11a1 1 0 00.76 1.65H10l-1 8 8.91-10.11a1 1 0 00-.76-1.65H11z"/></svg>
                    <span data-i18n="nav.automation">场景与自动化</span>
                </a>
                <a href="/access" class="side-link {{ 'active' if p == '/access' else '' }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/></svg>
                    <span data-i18n="nav.access">门口与安防</span>
                </a>
                <a href="/voice" class="side-link {{ 'active' if p == '/voice' else '' }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="9" y="2" width="6" height="12" rx="3"/><path d="M5 10v2a7 7 0 0014 0v-2M12 19v3"/></svg>
                    <span data-i18n="nav.voice">语音管家</span>
                </a>
                <a href="/history" class="side-link {{ 'active' if p == '/history' else '' }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 12a9 9 0 109-9 9 9 0 00-7.5 4"/><polyline points="3 3 3 8 8 8"/><polyline points="12 7 12 12 15 14"/></svg>
                    <span data-i18n="nav.history">家庭记录</span>
                </a>
                <a href="/settings" class="side-link {{ 'active' if p == '/settings' else '' }}">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 00.33 1.82l.06.06a2 2 0 11-2.83 2.83l-.06-.06a1.65 1.65 0 00-1.82-.33 1.65 1.65 0 00-1 1.51V21a2 2 0 11-4 0v-.09A1.65 1.65 0 009 19.4a1.65 1.65 0 00-1.82.33l-.06.06a2 2 0 11-2.83-2.83l.06-.06A1.65 1.65 0 004.6 15a1.65 1.65 0 00-1.51-1H3a2 2 0 110-4h.09A1.65 1.65 0 004.6 9a1.65 1.65 0 00-.33-1.82l-.06-.06a2 2 0 112.83-2.83l.06.06A1.65 1.65 0 009 4.6a1.65 1.65 0 001-1.51V3a2 2 0 114 0v.09a1.65 1.65 0 001 1.51 1.65 1.65 0 001.82-.33l.06-.06a2 2 0 112.83 2.83l-.06.06A1.65 1.65 0 0019.4 9a1.65 1.65 0 001.51 1H21a2 2 0 110 4h-.09a1.65 1.65 0 00-1.51 1z"/></svg>
                    <span data-i18n="nav.settings">家庭设置</span>
                </a>
            </nav>
            <div class="side-foot">
                <span data-i18n="system.online">系统在线</span> · v2.9
            </div>
        </aside>
        <div class="sidebar-overlay" id="sidebarOverlay"></div>

        <!-- 主区域 -->
        <div class="app-main">
            <header class="topbar">
                <button class="sidebar-toggle" id="sidebarToggle" aria-label="menu">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
                </button>
                <div class="topbar-title">
                    {% block page_header %}
                    <span data-i18n="nav.dashboard">我的家</span>
                    <small data-i18n="home.subtitle">一眼看懂现在的家</small>
                    {% endblock %}
                </div>
                <div class="topbar-right">
                    <span id="connectionIndicator" class="connection-indicator online"></span>
                    <span id="currentTime" class="time-display">--:--:--</span>
                    <button class="lang-switch" id="langSwitch" onclick="toggleDashboardLang()">
                        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <circle cx="12" cy="12" r="10"/>
                            <line x1="2" y1="12" x2="22" y2="12"/>
                            <path d="M12 2a15.3 15.3 0 014 10 15.3 15.3 0 01-4 10 15.3 15.3 0 01-4-10 15.3 15.3 0 014-10z"/>
                        </svg>
                        <span data-i18n="nav.lang">EN</span>
                    </button>
                </div>
            </header>
            <main class="main-content">
                <div id="notification" class="notification hidden"></div>
                {% block content %}{% endblock %}
            </main>
        </div>
    </div>

    <script src="{{ url_for('static', filename='js/lang.js') }}?v=20261008a"></script>
    <script>
        (function () {
            var sb = document.getElementById('sidebar');
            var ov = document.getElementById('sidebarOverlay');
            function open() { sb.classList.add('open'); ov.classList.add('show'); }
            function close() { sb.classList.remove('open'); ov.classList.remove('show'); }
            var t = document.getElementById('sidebarToggle');
            if (t) t.addEventListener('click', function () { sb.classList.contains('open') ? close() : open(); });
            if (ov) ov.addEventListener('click', close);
            window.toggleSidebar = function (force) { (force === false ? close : open)(); };
        })();
        // 语言切换兜底：各页 main.js 若定义了同名函数会覆盖本实现
        if (typeof window.toggleDashboardLang !== 'function') {
            window.toggleDashboardLang = function () {
                I18N.setLang(I18N.currentLang === 'zh' ? 'en' : 'zh');
            };
        }
    </script>
    {% block scripts %}{% endblock %}
</body>
</html>
