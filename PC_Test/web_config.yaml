# Web 仪表盘服务配置 —— run_web.py / web 包读取
# 命令行参数（--host/--port/--port-a/--port-b/--no-serial）覆盖本文件。

server:
  host: "0.0.0.0"     # 局域网可访问；仅本机用 127.0.0.1
  port: 5000

# 硬件链路：web 是全系统唯一硬件网关——本进程拉起 mcp_home_server.py 子进程
# （MCP stdio）独占 A/B 串口；语音助手等外部调用者经 HTTP
# （GET /api/hardware/tools + POST /api/hardware/tool）使用硬件，不碰串口。
serial:
  enabled: true       # false = 纯看板/演示模式（设备控制接口返回 503）
  port_a: auto        # Module A 传感器，如 COM7
  port_b: auto        # Module B 执行器，如 COM6

# 后台轮询 MCP get_sensor_status 的间隔（秒），新快照写入 SQLite
sensor_poll_interval: 1.0

# ── 语音助手 HTTP 服务（面板「语音」页与自动化「语音」动作的代理目标）────
# 环境变量 SMART_HOME_VOICE_URL 优先（Docker 里为 http://voice:8101）。
voice:
  url: "http://127.0.0.1:8101"

# ── 摄像头实时画面（人脸识别页面 /api/camera/stream 同源代理）──────────────
# 环境变量 SMART_HOME_CAMERA_URL 优先于这里（Docker 里为 http://camera:8080/video_feed，
# 桌面 start_all.py 会自动注入 http://127.0.0.1:<camera_port>/video_feed）。
camera:
  stream_url: "http://127.0.0.1:8080/video_feed"

# ── 自动化引擎：HTTP 出站（webhook）动作 ─────────────────────────────────
# 规则里的「HTTP 请求」积木把事件/状态推给外部系统（自家网关、MQTT 桥、另一台机器）。
# 默认只放行回环与内网地址：公网目标、以及 169.254.*（云厂商元数据服务）需要显式登记。
# 注意：GET /api/automation/rules 无鉴权，规则里的 URL 任何局域网客户端都读得到，
# 所以这条通道不带 Authorization/Cookie，也不跟随 3xx 跳转。
automation:
  http_enabled: true
  http_allow_public: false
  # 逐台登记允许的主机（精确匹配主机名，不区大小写）
  http_allowed_hosts: []        # 例: ["hooks.example.com"]
  http_timeout: 2.0             # 单次请求超时（秒，0.2~8.0）

# ── 人脸识别 ────────────────────────────────────────────────────────────
# simulation_mode=true：无模型时返回模拟人脸（FACE001/002/003），前端可演示。
# false：加载 models/face/yolov8n-face.pt 做真实 YOLOv8 人脸检测；
# embeddings.pkl 由 scripts/enroll_faces.py 生成（ArcFace 高精度嵌入）。
face:
  model_path: "models/face/yolov8n-face.pt"
  confidence_threshold: 0.4
  iou_threshold: 0.45
  max_faces: 5
  simulation_mode: false
  recognition:
    enabled: true
    # 嵌入模型只影响「认人」这一段的耗时，模型文件不进 Git（AGENTS.md 第 2 条），
    # 换文件 + 改这一行即可切换；两边都写清来源，见 docs/face-models.md。
    #   w600k_mbf.onnx  13MB，派上单脸 93ms（p50），A/B/C 留一法同人≥0.788、异人≤0.265
    #   recognition.onnx 174MB（iresnet50），派上单脸 411ms，同人≥0.804、异人≤0.200
    # 两者输入都是 112×112 RGB、(x-127.5)/127.5、输出 512 维，但向量空间互不相通：
    # 换模型后必须用 scripts/enroll_faces.py 重建 data/face/embeddings.pkl，
    # 否则库里旧原型与新查询比对必然全拒（引擎会显式停用认人并在门禁体检页说明）。
    # simple_grayscale_cosine：零依赖回退方案
    method: "arcface_onnx"
    model_path: "models/face/w600k_mbf.onnx"
    # 现场 A/B 原型之间曾达到约 0.54；提高绝对阈值并要求领先第二名，
    # 宁可提示重新面对摄像头，也不把相似人员误认成另一人。
    similarity_threshold: 0.62
    ambiguity_margin: 0.08
    image_size: 112
  # ── 门口识别哨兵：让「录了脸 → 自动开门」真的成立 ──────────────────────
  # 过去摄像头只出流、识别只装在 web 里，没人取帧，所以录完脸也不会开门。
  # 帧地址由上面的 camera.stream_url 推出（同服务的 /snapshot），不用单独配。
  watcher:
    enabled: true
    interval: 2.0          # 取帧间隔（秒）：派上只有一个可用核，别往 1 以下调
    motion_gate: true      # 只在 PIR 报「有人」后识别；从未收到过 motion 时自动退化为常转
    motion_hold: 20        # 最后一次 motion 之后继续识别的秒数（人走到门口要时间）
    cooldown: 60           # 同一张脸放行后多久内不再重复开门（人站在门口不该连开）
    # 重复识别去抖窗口（秒）：窗口内同一张脸的重复读数只算一次「开门动作」，
    # 但每一轮识别都照常写进 face_events（#75）。设 0 = 不去抖。
    repeat_window: 8.0
    min_face_px: 60        # 人脸短边小于此像素只报「离得太远」，不进识别也不记日志

# 独立门口超声波：尚未接线；不得用室内 PIR 代替距离数据。
security:
  doorway:
    enabled: false
    distance_cm: 100
    hold_sec: 30
    max_gap_sec: 5
