; Module B — Output Node
; 只负责接收命令并驱动执行器，不做任何业务判断。

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

build_flags =
    -Isrc

lib_deps =
    arduino-libraries/Servo@^1.2.1
    adafruit/Adafruit NeoPixel@^1.12.0
    olikraus/U8g2@^2.35.30
    ; 注意：不再使用 ArduinoJson —— Uno 2KB RAM 下其堆分配必然失败，
    ; JSON 解析改由 src/core/CommandParser.cpp 的零分配解析器完成。
