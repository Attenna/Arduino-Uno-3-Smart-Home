; Module B — Output Node
; 只负责接收命令并驱动执行器，不做任何业务判断。

[env:uno]
platform = atmelavr
board = uno
framework = arduino
monitor_speed = 115200

build_flags =
    -Isrc

lib_deps =
    arduino-libraries/Servo@^1.2.1
    adafruit/Adafruit NeoPixel@^1.12.0
    olikraus/U8g2@^2.35.30
    bblanchon/ArduinoJson@^7.2.1
